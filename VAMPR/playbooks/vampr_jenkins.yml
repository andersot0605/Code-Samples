#This is some complex but useful vulnerability analysis and patching automation written in Ansible (primarily for public sector that runs RHEL, and a specific type of Nessus Scanner, if you know you know. There are a few dependencies. Need ansible-core 2.16 or later, need python 3.12 with requests module, need enough Memory on your controller to handle high forks and execution against however many hosts you have at once, theoretically you could run some stuff serial but we chose speed over procedural safety due to the updates being fairly low risk because we exclude the big hitters like kernel.
#Vulnerability Analysis & Management of Patching and Remediation -- VAMPR

# ==============================================================================*
# PLAY 0/5: GATHER AND SET GLOBAL VARIABLES
# ==============================================================================*
- name: "Play 0/5: Gather Global Variables"
  hosts: localhost
  gather_facts: no
  tasks:
    - name: "Set hardcoded variables as facts for global access"
      set_fact:
        prompt_email_recipient:
          - "trevor.anderson@exampledomain.com"
        prompt_host_domain: "exampledomain.com"
        prompt_nessus_input: "examplenessussvr@exampledomain.com"

    - name: "TASK: Check if 'requests' library is installed on controller"
      ansible.builtin.command: "{{ ansible_playbook_python }} -c 'import requests'"
      register: requests_check
      failed_when: false
      changed_when: false

    - name: "TASK: Auto-install 'requests' library via pip if missing"
      ansible.builtin.pip:
        name: requests
        extra_args: "--user"
        executable: "{{ ansible_playbook_python }} -m pip"
      when: requests_check.rc != 0

# ==============================================================================*
# PLAY 1/5: GATHER VULNERABILITY DATA FROM NESSUS
# ==============================================================================*
- name: "Play 1/5: Query NESSUS for Vulnerabilities"
  hosts: all
  gather_facts: no
  tasks:
    - name: "TASK: Set FQDN and Query NESSUS"
      block:
        - name: "Sub-Task: Construct FQDN"
          set_fact:
            fqdn_target: "{{ inventory_hostname if '.' in inventory_hostname else inventory_hostname ~ '.' ~ hostvars['localhost'].prompt_host_domain }}"

        - name: "Sub-Task: Query NESSUS API"
          uri:
            url: "https://{{ hostvars['localhost'].prompt_nessus_input }}/rest/analysis"
            method: POST
            headers:
              x-apikey: "accesskey={{ nessus_automation_access_key }}; secretkey={{ nessus_automation_secret }};"
            body_format: json
            body:
              type: "vuln"
              sourceType: "cumulative"
              query:
                tool: "vulndetails"
                type: "vuln"
                startOffset: 0
                endOffset: 500
                filters:
                  - { filterName: "repositoryIDs", operator: "=", value: "3" }
                  - { filterName: "dnsName", operator: "=", value: "{{ fqdn_target }}" }
                  - { filterName: "severity", operator: "=", value: "4,3,2" }
            validate_certs: no
            return_content: yes
          register: nessus_response_raw
          delegate_to: localhost

        - name: "Sub-Task: Create structured list of vulnerabilities"
          set_fact:
            vulnerability_list: "{{ _parsed_vulns_json | from_json }}"
          vars:
            _parsed_vulns_json: >-
              {% set results = [] %}
              {% for item in nessus_response_raw.json.response.results | default([]) %}
                {% set text = item.pluginText | default('') %}
                {% set rpm_pairs = text | regex_findall('Remote package installed\\s*:\\s*(\\S+)[\\s\\S]*?Should be\\s*:\\s*(\\S+)') %}
                {% set fs = item.firstSeen | default(0) | int %}
                {% set pp = item.patchPubDate | default(0) | int %}
                {% for pair in rpm_pairs %}
                  {% set _ = results.append({
                    'vuln_name': item.pluginName | default('Unknown'),
                    'plugin_id': item.pluginID | default('Unknown'),
                    'severity': item.severity.name | default('Unknown'),
                    'first_seen': ('%Y-%m-%d' | strftime(fs)) if fs > 0 else 'Unknown',
                    'patch_pub': ('%Y-%m-%d' | strftime(pp)) if pp > 0 else 'Unknown',
                    'affected_version': pair[0],
                    'fix_version': pair[1],
                    'base_pkg': pair[0] | regex_replace('-[0-9]+.*$', ''),
                    'host': inventory_hostname
                  }) %}
                {% endfor %}
              {% endfor %}
              {{ results | to_json }}
          when: nessus_response_raw.json.response.results is defined

# ==============================================================================*
# PLAY 1.5/5: HOST INFRASTRUCTURE PREPARATION (ENHANCED)
# ==============================================================================*
- name: "Play 1.5/5: Host Infrastructure Preparation"
  hosts: all
  gather_facts: no
  become: yes
  vars:
    # Force Ansible to use the system's default Python 3 for this play
    # ansible_python_interpreter: /usr/bin/python3
  tasks:

    # --- BLOCK 1: GATHER FACTS & INSTALL DEPENDENCIES ---
    - name: "TASK: Gather minimal facts to check SELinux status"
      ansible.builtin.setup:
        filter:
          - ansible_selinux

    - name: "PREREQ: Ensure all SELinux Python bindings are installed"
      ansible.builtin.dnf:
        name:
          - python3-libselinux
          - policycoreutils-python-utils
        state: present
      # Only run this on hosts where SELinux is actually active
      when: ansible_selinux.status == "enabled"

    # --- BLOCK 2: MANAGE LOCAL ADMIN ACCOUNT ---
    - name: "TASK: Reset pam_faillock counter for admin_local"
      ansible.builtin.command: "faillock --user admin_local --reset"
      register: faillock_reset_raw
      failed_when: false
      changed_when: false

    - name: "TASK: Check current account aging rules for admin_local"
      ansible.builtin.command: "chage -l admin_local"
      register: admin_chage_raw
      changed_when: false
      failed_when: false

    - name: "TASK: Configure admin_local aging and disable password expiration"
      ansible.builtin.user:
        name: "admin_local"
        password_expire_max: 99999
        password_expire_min: 0
      when: admin_chage_raw.rc == 0

    - name: "TASK: Disable absolute account expiration and inactive lock for admin_local"
      ansible.builtin.command: "chage -I -1 -E -1 admin_local"
      when:
        - admin_chage_raw.rc == 0
        - >
          ('Account expires' in admin_chage_raw.stdout and 'never' not in admin_chage_raw.stdout) or
          ('Password inactive' in admin_chage_raw.stdout and 'never' not in admin_chage_raw.stdout)
      register: chage_unexpire_result
      changed_when: chage_unexpire_result.rc == 0

    # --- BLOCK 3: MANAGE SELINUX (ONLY IF ENABLED) ---
    - name: "TASK: Ensure correct SELinux context for DNF/YUM logging"
      ansible.builtin.sefcontext:
        target: '/var/log/dnf.log'
        setype: 'var_log_t'
        state: present
      when: ansible_selinux.status == "enabled"

    - name: "TASK: Restore SELinux contexts on critical paths"
      ansible.builtin.command: "restorecon -Rv /home2 /root /var/log"
      register: restorecon_output
      changed_when: "'Relabeled' in restorecon_output.stdout"
      failed_when: false
      when: ansible_selinux.status == "enabled"

# ==============================================================================*
# PLAY 2/5: LOCAL DNF CHECKS (RESTORED TO ORIGINAL HIGH-SPEED)
# ==============================================================================*
- name: "Play 2/5: Local DNF Checks"
  hosts: all
  gather_facts: no
  become: yes

  tasks:
    - name: "TASK: Force DNF Metadata Refresh"
      ansible.builtin.command: "dnf makecache"
      changed_when: false

    - name: "TASK: Execute Consolidated Sudo Checks (Bypasses Repeated PAM Hits)"
      shell: |
        echo "===START_UPGRADES==="
        dnf list upgrades --quiet || true
        echo "===START_INSTALLED==="
        dnf list installed --quiet || true
        echo "===START_IDENTITY==="
        subscription-manager identity || true
      register: local_checks_raw
      changed_when: false

    - name: "TASK: Parse and Rebuild Expected System Facts"
      set_fact:
        dnf_upgrades_result:
          stdout: "{{ (local_checks_raw.stdout.split('===START_UPGRADES===')[1].split('===START_INSTALLED===')[0]) | trim }}"
        dnf_installed_result:
          stdout: "{{ (local_checks_raw.stdout.split('===START_INSTALLED===')[1].split('===START_IDENTITY===')[0]) | trim }}"
        subman_identity:
          stdout: "{{ (local_checks_raw.stdout.split('===START_IDENTITY===')[1]) | trim }}"
          stdout_lines: "{{ (local_checks_raw.stdout.split('===START_IDENTITY===')[1] | trim).split('\n') }}"

# ==============================================================================*
# PLAY 2.5/5: SATELLITE REGISTRATION RECOVERY (Corrected Logic)
# ==============================================================================*
- name: "Play 2.5/5: Satellite Registration Recovery"
  hosts: all
  gather_facts: no
  become: yes
  serial: 10                  # Controls the batch size for recovery
  any_errors_fatal: false
  tasks:
    - name: "TASK: Evaluate Drift from Desired Configuration"
      set_fact:
        # Looking for 'Library' inside the subscription-manager identity output
        is_drifted: "{{ 'Library' not in (hostvars[inventory_hostname].subman_identity.stdout | default('')) }}"

    # This block executes the fix natively without nested include_tasks issues
    - name: "RECOVERY BLOCK: Fix registration drift"
      block:
        - name: "REG-FIX: Determine RHEL major version (Corrected)"
          set_fact:
            # The parentheses are critical for correct evaluation order.
            rhel_version: "{{ ('el9' in (dnf_installed_result.stdout | default(''))) | ternary('9', '8') }}"

        - name: "REG-FIX: Force clean unregister/re-register host to 'Library'"
          ansible.builtin.command: >
            subscription-manager register
            --org="exampleorg"
            --activationkey="RHEL{{ rhel_version }}"
            --force
          register: register_result
          throttle: 5 # Safe throttle to protect Satellite's database thread
          until: register_result.rc == 0
          retries: 3
          delay: 10

        - name: "REG-FIX: Clean and rebuild DNF cache after registration"
          ansible.builtin.shell: "dnf clean all && dnf makecache"
          when: register_result.rc == 0

        # Update the dnf upgrades fact so Play 4/5 knows what updates are now available
        - name: "REG-FIX: Update upgrades list for recovered host"
          ansible.builtin.shell: "dnf list upgrades --quiet || true"
          register: recovered_dnf_upgrades
          changed_when: false

        - name: "REG-FIX: Save updated upgrades fact"
          set_fact:
            dnf_upgrades_result:
              stdout: "{{ recovered_dnf_upgrades.stdout | trim }}"

      # ONLY trigger this block if the host actually has drift!
      when: is_drifted | bool

# ==============================================================================*
# PLAY 3/5: CHECK SATELLITE FOR ALL UNIQUE PACKAGES
# ==============================================================================*
- name: "Play 3/5: Query Red Hat Satellite for Exact Packages"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "TASK: Aggregate unique fix versions safely"
      set_fact:
        master_vuln_list: "{{ groups['all'] | map('extract', hostvars, 'vulnerability_list') | select('defined') | list | flatten }}"
        
    - name: "TASK: Query Satellite API for package availability"
      uri:
        url: "https://examplesatelliteserver@exampledomain.com/katello/api/packages?search=nvra={{ item.fix_version | urlencode }}"
        method: GET
        user: "{{ local_sat_user }}"
        password: "{{ local_sat_pass }}"
        force_basic_auth: yes
        validate_certs: no
        return_content: yes
        status_code: [200, 404]
      register: satellite_query_results
      until: satellite_query_results.status in [200, 404]
      retries: 5
      delay: 10
      loop: "{{ master_vuln_list | unique(attribute='fix_version') }}"
      loop_control:
        label: "{{ item.fix_version }}"
        pause: 0.1
        
    - name: "TASK: Build Satellite lookup table"
      set_fact:
        sat_lookup: "{{ sat_lookup | default({}) | combine({ item.item.fix_version: (item.json.total > 0) }) }}"
      loop: "{{ satellite_query_results.results }}"
      when: item.status == 200 and item.item is defined
      no_log: true

# ==============================================================================*
# PLAY 4/5: AUTO-REMEDIATION
# ==============================================================================*
- name: "Play 4/5: Targeted Remediation"
  hosts: all
  gather_facts: no
  become: yes
  vars:
    reboot_packages_regex: '^(kernel.*|kmod.*|glibc.*|systemd.*|dbus.*|linux-firmware.*|dracut.*|grub2.*|shim.*|microcode_ctl.*|rke2.*|container.*|docker.*)$'
  tasks:
    - name: "TASK: Pause for 2 minutes if a CV was promoted to allow clients to sync"
      ansible.builtin.pause:
        minutes: 1
        prompt: "A Content View was promoted. Waiting for 1 minute for client subscriptions to refresh..."
      when: inventory_hostname in (hostvars['localhost'].cv_promoted_hosts | default([]))

    - name: "TASK: Refresh DNF cache on clients whose CV was promoted"
      ansible.builtin.command: "dnf clean all && dnf makecache"
      when: inventory_hostname in (hostvars['localhost'].cv_promoted_hosts | default([]))
      changed_when: false
      register: dnf_refresh_result

    - name: "TASK: Re-check DNF for available upgrades after promotion and cache refresh"
      ansible.builtin.command: "dnf list upgrades --quiet"
      register: dnf_upgrades_recheck
      when: inventory_hostname in (hostvars['localhost'].cv_promoted_hosts | default([]))
      changed_when: false

    - name: "TASK: Identify safe packages for remediation"
      set_fact:
        remediation_targets: "{{ _targets_json | from_json }}"
      vars:
        _targets_json: >-
          {% set targets = [] %}
          {% set promoted = inventory_hostname in (hostvars['localhost'].cv_promoted_hosts | default([])) %}
          {# Use the re-checked DNF output if available, otherwise use the original from Play 2 #}
          {% set dnf_out = dnf_upgrades_recheck.stdout if promoted and dnf_upgrades_recheck is defined else dnf_upgrades_result.stdout %}
          
          {% for vuln in vulnerability_list | default([]) %}
            {% set is_reboot = vuln.base_pkg is regex(reboot_packages_regex) %}
            {% set is_in_sat = hostvars['localhost'].sat_lookup[vuln.fix_version] | default(false) %}
            {% set dnf_shows_available = vuln.base_pkg in dnf_out %}
            
            {% if not is_reboot and is_in_sat and dnf_shows_available %}
              {% if vuln.base_pkg not in targets %}{% set _ = targets.append(vuln.base_pkg) %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ targets | unique | to_json }}

    - name: "TASK: Execute DNF Update for non-reboot packages"
      ansible.builtin.dnf:
        name: "{{ remediation_targets }}"
        state: latest
        skip_broken: yes
      when: remediation_targets | length > 0
      register: dnf_update_output

    - name: "TASK: Summary of remediated packages"
      debug:
        msg: "Remediated the following on {{ inventory_hostname }}: {{ remediation_targets | join(', ') }}"
      when: remediation_targets | length > 0 and dnf_update_output.changed

    # --- 🔀 NEW CONDITIONAL HOOKS FOR TEAMS ---
    - name: "TASK: Trigger Team-Specific Post-Patch Hooks"
      ansible.builtin.include_tasks: "conditional_tasks/post_patch_hooks.yml"
      when: dnf_update_output.changed | default(false)

# ==============================================================================*
# PLAY 5/5: REPORT EXPORT AND DISTRIBUTION
# ==============================================================================*
- name: "Play 5/5: Report Export and Distribution"
  hosts: localhost
  gather_facts: no
  vars:
    # NOTE: If you want glibc or any other reboot-sensitive package to auto-patch, remove it from this regex in Plays 4 and 5
    reboot_packages_regex: '^(kernel.*|glib2|glibc|dbus.*|systemd.*|linux-firmware)$'
  tasks:
    - name: "TASK: Generate Dynamic CSV Filename"
      set_fact:
        csv_filename: "./nessus_vulnerability_report_{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.csv"

    - name: "TASK: Generate JSON input for Python script"
      ansible.builtin.copy:
        content: "{{ ansible_input_data | to_json }}"
        dest: "/tmp/vampr_report_input.json"
      vars:
        ansible_input_data:
          master_vuln_list: "{{ hostvars['localhost'].master_vuln_list }}"
          sat_lookup: "{{ hostvars['localhost'].sat_lookup | default({}) }}"
          hostvars: "{{ hostvars }}"
          reboot_packages_regex: "{{ reboot_packages_regex }}"
          cv_promoted_hosts: "{{ hostvars['localhost'].cv_promoted_hosts | default([]) }}"

    - name: "TASK: Build Final Report Data via Python for Performance"
      ansible.builtin.shell: "python3 process_report.py < /tmp/vampr_report_input.json"
      register: report_processor_result
      changed_when: false

    - name: "TASK: Set Final Report Rows from Python Script Output"
      set_fact:
        report_rows: "{{ report_processor_result.stdout | from_json }}"

    - name: "TASK: Clean up temporary JSON input file"
      ansible.builtin.file:
        path: "/tmp/vampr_report_input.json"
        state: absent

    - name: "TASK: Generate CSV File"
      copy:
        dest: "{{ csv_filename }}"
        content: |
          Vulnerability Name,Plugin ID,Severity,First Discovered,Patch Published,Affected Version,Fix Version,Satellite Available,Upgrade Available,CV Promoted,Reboot Required,Patched,Needs Rescan,Affected Hosts
          {% for row in report_rows %}
          "{{ row.name }}",{{ row.id }},{{ row.sev }},"{{ row.first_seen }}","{{ row.patch_pub }}","{{ row.aff }}","{{ row.fix }}",{{ row.sat }},{{ row.upgrade_available }},{{ row.cv_promoted }},{{ row.reboot_req }},{{ row.patched }},"{{ row.needs_rescan }}","{{ row.nessus_hosts }}"
          {% endfor %}
          
    - name: "TASK: Email CSV Report"
      mail:
        host: localhost
        port: 25
        from: "exampleemail@exampledomain.com"
        to: "{{ prompt_email_recipient | join(',') }}"
        subject: "Mission Report: Nessus Vulnerability Remediation Tracking"
        body: |
          Attached is the vulnerability cross-reference report.
          - CV Promoted: Indicates if a Content View was promoted for any affected host's Lifecycle environment.
          - Reboot Required: Indicates if the vulnerability fix requires a system reboot to take effect.
          - Patched: Indicates if the playbook automatically applied the fix via DNF on any affected hosts.
          - Needs Rescan: Indicates "Yes" if nessus reported a vulnerability but DNF confirms the fixed version is already present on any affected system (indicating nessus data is stale).
        attach:
          - "{{ csv_filename }}"
      delegate_to: localhost

# ==============================================================================*
# PLAY 5.5/5: LAUNCH AD-HOC NESSUS RESCAN
# ==============================================================================*
- name: "Play 5.5/5: Mission - Ad-Hoc NESSUS Scan Launch"
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    # Ensure this matches your Tenable.sc configured Scan ID
    nessus_scan_id: "1432"
  tasks:
    - name: "TASK: Build comma-separated list of simple hostnames"
      set_fact:
        # Directly joins inventory hostnames without needing fact gathering
        nessus_target_list: "{{ groups['all'] | join(',') }}"

    - name: "TASK: Ensure we have targets to scan"
      fail:
        msg: "No targets found in the inventory to scan."
      when: nessus_target_list | length == 0

    - name: "TASK: Display targets to be updated"
      debug:
        msg: "Overwriting Scan ID {{ nessus_scan_id }} targets with: {{ nessus_target_list }}"

    - name: "TASK: Step 1 - Hard Overwrite NESSUS Scan Targets"
      uri:
        url: "https://{{ hostvars['localhost'].prompt_nessus_input }}/rest/scan/{{ nessus_scan_id }}"
        method: PATCH
        headers:
          x-apikey: "accesskey={{ nessus_automation_access_key }}; secretkey={{ nessus_automation_secret }};"
        body_format: json
        body:
          ipList: "{{ nessus_target_list }}"
        validate_certs: no
        status_code: 200
      register: scan_update_result

    - name: "TASK: Step 2 - Launch the updated NESSUS Scan"
      uri:
        url: "https://{{ hostvars['localhost'].prompt_nessus_input }}/rest/scan/{{ nessus_scan_id }}/launch"
        method: POST
        headers:
          x-apikey: "accesskey={{ nessus_automation_access_key }}; secretkey={{ nessus_automation_secret }};"
        body_format: json
        body: {}
        validate_certs: no
        return_content: yes
        status_code: 200
      register: scan_launch_result

    - name: "TASK: Display Scan Launch Confirmation"
      debug:
        msg: 
          - "Scan Name: {{ scan_update_result.json.response.name | default('N/A') }}"
          - "Status: Scan targets successfully overwritten and scan launched!"

# ==============================================================================*
# PLAY 6: FORWARD VAMPR METRICS TO SPLUNK
# ==============================================================================*
- name: "Play 6: Forward VAMPR Remediation Data to Splunk"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "TASK: Ensure report_rows exists before forwarding"
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].report_rows is defined
        msg: "No report_rows data found to send to Splunk."
      ignore_errors: yes
      register: splunk_precheck

    - name: "TASK: Forward vulnerability tracking data to Splunk HEC"
      ansible.builtin.uri:
        # Note: Ensure your OpenBao 'splunk_hec_url' includes the full path 
        # e.g., https://<splunk_host>:8088/services/collector/event
        url: "{{ splunk_hec_url }}"
        method: POST
        headers:
          Authorization: "Splunk {{ splunk_hec_token }}"
        body_format: json
        body:
          host: "vampr-controller"
          source: "vampr_playbook"
          sourcetype: "_json"
          event: "{{ item }}"
        validate_certs: no  # Set to yes if your Splunk HEC uses a trusted CA
        status_code: [200, 201]
      # Loop through the aggregated JSON objects created for the CSV in Play 5
      loop: "{{ hostvars['localhost'].report_rows | default([]) }}"
      loop_control:
        label: "Forwarding Plugin ID {{ item.id }} to Splunk"
        pause: 0.1 # Slight pause to prevent HEC endpoint throttling
      when: splunk_precheck is not failed
      register: splunk_result
      until: splunk_result.status in [200, 201]
      retries: 3
      delay: 5

    - name: "TASK: Splunk Forwarding Status"
      ansible.builtin.debug:
        msg: "Successfully forwarded {{ hostvars['localhost'].report_rows | length }} events to Splunk."
      when: splunk_precheck is not failed
