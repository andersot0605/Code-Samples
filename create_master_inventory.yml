---
# ==============================================================================
# Play 1: Fetch hosts from Satellite API & register in memory
# ==============================================================================
- name: Fetch Host List from RedHat Satellite
  hosts: localhost
  gather_facts: false
  connection: local

  vars_prompt:
    - name: "satellite_server_hostname"
      prompt: "Enter your Satellite server hostname (e.g., satellite-server.example.com)"
      private: no
    - name: "satellite_user"
      prompt: "Enter your Satellite username"
      private: no
    - name: "satellite_password"
      prompt: "Enter your Satellite password or Personal Access Token"
      private: yes

  tasks:
    - name: Ensure the server URL starts with https://
      ansible.builtin.set_fact:
        final_url: "{{ 'https://' ~ satellite_server_hostname if not satellite_server_hostname.startswith('http') else satellite_server_hostname }}"

    - name: Call Satellite API to get all hosts
      ansible.builtin.uri:
        url: "{{ final_url }}/api/v2/hosts?per_page=500"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: yes
        validate_certs: no
        return_content: yes
        timeout: 120
      register: satellite_api_result

    - name: Check if API call was successful
      ansible.builtin.fail:
        msg: "API call failed. Status: {{ satellite_api_result.status }}. Message: {{ satellite_api_result.msg | default('No message') }}"
      when: satellite_api_result.status != 200

    - name: Check if any hosts were returned
      ansible.builtin.fail:
        msg: "API call succeeded, but no hosts were found."
      when: satellite_api_result.json.results | length == 0

    - name: Dynamically populate in-memory group 'discovered_hosts'
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: discovered_hosts
      loop: "{{ satellite_api_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"

# ==============================================================================
# Play 2: Ping all discovered hosts & collect reachables
# ==============================================================================
- name: Test Host Connectivity
  hosts: discovered_hosts
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: Ping host via Ansible SSH
      ansible.builtin.ping:
      register: ping_result

    - name: Add reachable host to 'reachable_hosts' group
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        groups: reachable_hosts
      when: ping_result is succeeded

# ==============================================================================
# Play 3: Generate the final inventory file containing reachable hosts only
# ==============================================================================
- name: Generate Inventory File
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Initialize or reset inventory file
      ansible.builtin.copy:
        content: "[satellite_hosts]\n"
        dest: "./all_hosts.ini"
        mode: '0644'

    - name: Append reachable hosts to inventory file
      ansible.builtin.lineinfile:
        path: "./all_hosts.ini"
        line: "{{ item }}"
      loop: "{{ groups['reachable_hosts'] | default([]) }}"

    - name: Summary report
      ansible.builtin.debug:
        msg: >-
          Discovered {{ groups['discovered_hosts'] | length }} host(s).
          Successfully wrote {{ groups['reachable_hosts'] | default([]) | length }} reachable host(s) to all_hosts.ini.
